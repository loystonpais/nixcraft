name: Update Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # Daily at 01:00 UTC, one hour after minecraft-sources

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 30 mins

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v17
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update sources
        run: nix flake update sources

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(sources): update sources"
            git push
          fi
